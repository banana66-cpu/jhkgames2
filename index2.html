    <a class="card mint" href="games/snake/index.html" target="_blank" rel="noopener">
      <span class="icon" aria-hidden="true">🐍</span>
      <span class="name">뱀 게임</span>

      <span class="icon" aria-hidden="true">🔢</span>
      <span class="name">숫자 합치기</span>

      <span class="icon" aria-hidden="true">💣</span>
      <span class="name">지뢰찾기</span>

      <span class="icon" aria-hidden="true">⭕</span>
      <span class="name">틱택토</span>
